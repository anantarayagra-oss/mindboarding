{% extends "base.html" %}
{% from "_macros.html" import csrf_field with context %}
{% block title %}{{ heading }}{% endblock %}
{% block content %}
<section class="panel panel--center panel--narrow">
  <h1>{{ heading }}</h1>
  <p>{{ message }}</p>
  <form method="post" action="{{ action }}" class="button-row button-row--center" data-loading-form>
    {{ csrf_field() }}
    <a class="btn btn--outline" href="{{ cancel_url }}">Cancel</a>
    <button type="submit" class="btn btn--danger" data-loading-text="Deleting…">{{ button_label }}</button>
  </form>
</section>
{% endblock %}
