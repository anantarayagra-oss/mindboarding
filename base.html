<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Home{% endblock %} · Mindboarding</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</head>
<body class="app-body">
  <a class="skip-link" href="#main">Skip to main content</a>
  <div class="app">
    {% include "_sidebar.html" %}
    <div class="scrim" data-drawer-scrim hidden></div>
    <div class="app-main">
      {% include "_topbar.html" %}
      <main id="main" class="content" tabindex="-1">
        {% include "_flash.html" %}
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>
</body>
</html>
